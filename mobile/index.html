<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Alexa Gym Management App">
  <meta name="google-signin-client_id" content="879575727886-aqc2adsdq6p357ii1n3frvm2kv1d7g17.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alexa Gym">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alexa Gym</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; padding: 0; background-color: #07080F; overflow: hidden;">
  <div id="app-loading" style="position: fixed; inset: 0; background: #07080F; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div style="width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #10B981, #059669); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.45); margin-bottom: 24px;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="white">
        <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 5.57 14.14 7 12.71 15.57 21.29 12 24.86 13.43 26.29 14.86 24.86 16.29 26.29 18.43 24.14 19.86 25.57 21.29 24.14l-1.43-1.43 2.14-2.14-1.43-1.43 1.43-1.43-3.57-3.57-1.43 1.43z"/>
      </svg>
    </div>
    <div style="color: #ffffff; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px;">Alexa Gym</div>
    <div style="color: #94a3b8; font-size: 14px; font-weight: 500; margin-bottom: 30px;">Build Your Better Self</div>
    <div style="width: 44px; height: 44px; border: 3.5px solid rgba(16, 185, 129, 0.15); border-top: 3.5px solid #10B981; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>
  <script>
    (function() {
      var check = setInterval(function() {
        var el = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
        if (el) {
          var loader = document.getElementById('app-loading');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.3s ease';
            setTimeout(function() { if (loader) loader.remove(); }, 300);
          }
          clearInterval(check);
        }
      }, 200);
      setTimeout(function() {
        var loader = document.getElementById('app-loading');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.3s ease';
          setTimeout(function() { if (loader) loader.remove(); }, 300);
        }
        clearInterval(check);
      }, 4500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
